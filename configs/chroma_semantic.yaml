project:
  name: chroma_semantic
data:
  input_dir: ./examples/faiss_local_rag/docs
  parser:
    name: docling
  chunker:
    name: semantic
    max_sentences: 4
embedding:
  name: sentence_transformers
  dimension: 384
store:
  name: chroma
  collection_name: chroma_semantic
retrieval:
  name: query_rewrite
  top_k: 4
reranker:
  name: bge
generator:
  name: openai_compatible
evaluation:
  enabled: true
  evaluators:
    - retrieval_metrics
    - deepeval

